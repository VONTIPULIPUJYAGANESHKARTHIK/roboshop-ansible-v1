- name: configure cart server
  hosts: cart
  become: yes

  vars:
    redis_host: redis.gcart.store
    catalouge_host: catalouge.gcart.store

  tasks:
    - name: disable default nodejs
      command: dnf module disable nodejs -y

    - name: enable nodejs24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:
        name: nodejs
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove cart.zip
      file:
        path: /tmp/cart.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop
        mode: "0755"

    - name: download cart application
      get_url:
        url: https://roboshop-builds.s3.amazonaws.com/cart.zip
        dest: /tmp/cart.zip

    - name: unzip cart
      unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes

    - name: set application permissions
      file:
        path: /app
        owner: roboshop
        group: roboshop
        recurse: yes

    - name: create ansible temporary directory
      file:
        path: /app/.ansible/tmp
        state: directory
        owner: roboshop
        group: roboshop
        mode: "0700"

    - name: install dependencies
      community.general.npm:
        path: /app
      become_user: roboshop
      environment:
        HOME: /app
        npm_config_cache: /app/.npm

    - name: copy cart service
      template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service
        owner: root
        group: root
        mode: "0644"

    - name: daemon reload
      systemd_service:
        daemon_reload: true

    - name: start and enable cart
      service:
        name: cart
        state: restarted
        enabled: yes
