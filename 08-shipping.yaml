- name: configure shipping server
  hosts: shipping
  become: yes

  tasks:
    - name: enable maven 3.9
      command: dnf module enable maven:3.9 -y

    - name: install maven and java25
      dnf:
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove shipping.zip
      file:
        path: /tmp/shipping.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop
        mode: "0755"

    - name: download shipping application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: unzip shipping
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: set application permissions
      file:
        path: /app
        owner: roboshop
        group: roboshop
        recurse: yes

    - name: create maven cache directory
      file:
        path: /app/.m2
        state: directory
        owner: roboshop
        group: roboshop
        mode: "0755"

    - name: check maven version
      command: mvn --version
      register: mvn_default

    - name: print maven version
      debug:
        msg: "{{ mvn_default.stdout_lines }}"

    - name: install dependencies
      command: mvn clean package
      args:
        chdir: /app
      become_user: roboshop
      environment:
        HOME: /app
        MAVEN_OPTS: "-Dmaven.repo.local=/app/.m2/repository"
