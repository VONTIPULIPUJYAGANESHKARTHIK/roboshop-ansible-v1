- name: Create EC2 instances and R53 records
  hosts: local
  connection: local

  vars:
    instances:
      - mongodb
      - redis
      - mysql
      - rabbitmq

    action: create
    domain_name: gcart.store
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:
    # Step 1: Create EC2 instances
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        state: present
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    # Step 2: Print EC2 creation output
    - name: Print EC2 instance details
      debug:
        msg: "{{ ec2_output.results }}"

    # Step 3: Create Route 53 DNS records
    - name: Create Route 53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.instances is defined
        - item.instances | length > 0
