- name: create ec2 instances and r53 records
  hosts: local
  connection: local

  vars:
    # Create specific instances:
    # ansible-playbook roboshop.yaml -e "instances=['mongodb','redis']"

    # Delete instances:
    # ansible-playbook roboshop.yaml -e "action=delete"

    instances:
      - mongodb
      - redis
      - mysql
      - rabbitmq
      - catalogue
      - user
      - cart
      - shipping
      - payment
      - frontend

    action: create
    domain_name: gcart.store
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:
    # CREATE EC2 INSTANCES
    - name: create ec2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        exact_count: 1
        filters:
          "tag:Name": "roboshop-{{ item }}"
        state: started
        wait: true
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    # CREATE PRIVATE ROUTE53 RECORDS
    - name: create r53 private records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    # CREATE FRONTEND PUBLIC ROUTE53 RECORD
    - name: create r53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.item == "frontend"

    # DELETE PRIVATE ROUTE53 RECORDS
    - name: delete r53 private records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        type: A
      loop: "{{ instances }}"
      when: action == "delete"

    # DELETE FRONTEND PUBLIC ROUTE53 RECORD
    - name: delete r53 record for frontend
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
      when:
        - action == "delete"
        - "'frontend' in instances"

    # DELETE EC2 INSTANCES
    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
        region: "{{ region }}"
        filters:
          "tag:Name": "roboshop-{{ item }}"
      loop: "{{ instances }}"
      when: action == "delete"
