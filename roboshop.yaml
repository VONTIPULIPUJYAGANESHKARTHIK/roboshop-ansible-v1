- name: Create EC2 instances and R53 records
  hosts: local
  connection: local

  vars:
    instances:
      - mongodb
      - redis
      - mysql
      - rabbitMQ

    action: create
    domain_name: gcart.store
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        state: present
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: print the ec2 creation
      debug: msg:"{{ ec2_output }}"
